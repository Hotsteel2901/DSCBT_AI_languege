[package]
name = "dsc"
version = "4.0.0"
edition = "2021"
description = "DSCBT v4 native compiler"
build = "build.rs"

[[bin]]
name = "dsc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cranelift-codegen = "0.115"
cranelift-frontend = "0.115"
cranelift-module = "0.115"
cranelift-object = "0.115"
target-lexicon = "0.12"
